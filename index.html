<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- 給 LINE / FB 轉發用的預覽設定 (Open Graph) -->
    <meta property="og:title" content="秘密祝福卡">
    <meta property="og:description" content="宇宙每天給您的祝福，請憑直覺選擇一張卡！">
    <meta property="og:image" content="https://card-for-secret.netlify.app/back.jpg">
    <meta property="og:url" content="https://card-for-secret.netlify.app/">
    <meta property="og:type" content="website">

    <!-- 網頁瀏覽器分頁上的標題 -->
    <title>宇宙每天給您的祝福</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #A67B38;
            --gold-deep: #8F6A2E;
            --gold-line: #E6D09C;
            --serif: "Noto Serif TC", "Songti TC", "PMingLiU", "Microsoft JhengHei", serif;
        }

        * { -webkit-tap-highlight-color: transparent; }

        html, body { height: 100%; }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            font-family: var(--serif);
            margin: 0;
            padding: max(14px, env(safe-area-inset-top)) 0 max(16px, env(safe-area-inset-bottom)) 0;
            box-sizing: border-box;
            overflow: hidden;

            /* 亮白、亮米色為主底，點綴優雅的金黃光暈流動（呼吸燈維持原樣） */
            background: linear-gradient(-45deg, #ffffff, #fdfbf4, #f5e3ad, #ffffff, #f9f4e3, #ebd494);
            background-size: 400% 400%;
            animation: gradientBreath 6s ease-in-out infinite;
        }

        @keyframes gradientBreath {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header { text-align: center; flex: 0 0 auto; }

        h1 {
            color: var(--gold);
            font-size: clamp(22px, 6.4vw, 30px);
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: 4px;
            text-shadow: 0 1px 2px rgba(166, 123, 56, 0.18);
        }

        #statusText {
            color: var(--gold-deep);
            font-size: clamp(14px, 4vw, 17px);
            font-weight: 500;
            letter-spacing: 3px;
            margin: 0;
        }

        /* 卡片寬度：同時受螢幕寬度與高度限制，確保四張卡＋文字＋按鈕一頁內看完 */
        .cards-grid {
            --cw: min(40vw, 210px, calc((100dvh - 215px) / 3));
            display: grid;
            grid-template-columns: repeat(2, var(--cw));
            column-gap: clamp(14px, 5vw, 28px);
            row-gap: 10px;
            justify-content: center;
            flex: 0 0 auto;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-slot {
            width: 100%;
            aspect-ratio: 2 / 3;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-slot:active { transform: scale(0.97); }

        .card-face {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.25);
            overflow: hidden;
        }
        .card-face img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 分類文字：在卡牌之下 */
        .card-title {
            color: var(--gold);
            font-size: clamp(15px, 4.4vw, 19px);
            font-weight: 700;
            letter-spacing: 3px;
            margin-top: 8px;
            padding-bottom: 3px;
            border-bottom: 2px solid var(--gold-line);
        }

        /* 下方唯一的膠囊 */
        .pill {
            flex: 0 0 auto;
            font-family: var(--serif);
            padding: 11px 34px;
            font-size: clamp(15px, 4.4vw, 18px);
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(253,247,229,0.92));
            color: var(--gold);
            border: 1px solid #D4AF37;
            border-radius: 999px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
            transition: 0.3s;
            white-space: nowrap;
        }
        .pill:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.15);
        }

        /* ===== 抽牌後放大的大畫面 ===== */
        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: max(14px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom)) 0;
            box-sizing: border-box;
            background: rgba(253, 251, 244, 0.93);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
            z-index: 10;
        }
        #overlay.show { opacity: 1; pointer-events: auto; }

        .big-slot {
            --bw: min(86vw, 460px, calc((100dvh - 150px) * 2 / 3));
            width: var(--bw);
            aspect-ratio: 2 / 3;
            perspective: 1400px;
        }
        .big-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: scale(0.7) rotateY(0deg);
            transition: transform 0.8s cubic-bezier(0.3, 0.2, 0.2, 1);
        }
        #overlay.show .big-inner { transform: scale(1) rotateY(180deg); }

        .big-front, .big-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 14px 40px rgba(166, 123, 56, 0.35);
        }
        .big-back { transform: rotateY(180deg); }
        .big-front img, .big-back img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <h1>宇宙每天給您的祝福</h1>
        <p id="statusText">請憑直覺選擇一張卡！</p>
    </header>

    <div class="cards-grid">
        <div class="card-wrapper" data-category="宇宙祝福">
            <div class="card-slot" onclick="drawCard(this)"><div class="card-face"><img src="back.jpg" alt="宇宙祝福"></div></div>
            <div class="card-title">宇宙祝福</div>
        </div>

        <div class="card-wrapper" data-category="每日實踐">
            <div class="card-slot" onclick="drawCard(this)"><div class="card-face"><img src="back.jpg" alt="每日實踐"></div></div>
            <div class="card-title">每日實踐</div>
        </div>

        <div class="card-wrapper" data-category="豐盛顯化">
            <div class="card-slot" onclick="drawCard(this)"><div class="card-face"><img src="back.jpg" alt="豐盛顯化"></div></div>
            <div class="card-title">豐盛顯化</div>
        </div>

        <div class="card-wrapper" data-category="心靈力量">
            <div class="card-slot" onclick="drawCard(this)"><div class="card-face"><img src="back.jpg" alt="心靈力量"></div></div>
            <div class="card-title">心靈力量</div>
        </div>
    </div>

    <button class="pill" onclick="window.open('https://card-for-secret.netlify.app/')">吸引力法則起源</button>

    <!-- 抽牌後的大畫面：上方卡片、下方「再翻一次」 -->
    <div id="overlay">
        <div class="big-slot">
            <div class="big-inner">
                <div class="big-front"><img src="back.jpg" alt="卡背"></div>
                <div class="big-back"><img id="bigResult" src="" alt="抽到的卡"></div>
            </div>
        </div>
        <button class="pill" onclick="closeCard()">再翻一次</button>
    </div>

    <script>
        // 定義不同的卡牌類別與 subset
        const dailyPracticeCardsSubset = [1, 2, 3, 4, 7, 13, 14, 16, 19, 20, 22, 24, 25, 30, 33, 35, 37, 41, 42, 43, 45, 49, 51, 53, 56, 57, 58, 59, 60, 61];
        const abundanceCardsSubset = [2, 4, 9, 10, 13, 16, 17, 23, 25, 32, 36, 38, 46, 48];
        const soulPowerCardsSubset = [5, 6, 8, 11, 12, 15, 16, 17, 18, 20, 21, 26, 27, 28, 29, 31, 34, 35, 39, 40, 41, 42, 44, 46, 47, 50, 52, 54, 55, 60, 61, 62];

        const allCategoryCards = {
            "宇宙祝福": Array.from({length: 62}, (_, i) => i + 1),
            "每日實踐": dailyPracticeCardsSubset,
            "豐盛顯化": abundanceCardsSubset,
            "心靈力量": soulPowerCardsSubset
        };

        const overlay = document.getElementById('overlay');
        const bigResult = document.getElementById('bigResult');

        function drawCard(slot) {
            if (overlay.classList.contains('show')) return;

            const category = slot.closest('.card-wrapper').getAttribute('data-category');
            const categoryCards = allCategoryCards[category];
            const selectedCardNumber = categoryCards[Math.floor(Math.random() * categoryCards.length)];

            const src = "card(" + selectedCardNumber + ").jpg";
            // 圖片載入完成後才翻牌，避免翻到一半還是空白
            bigResult.onload = bigResult.onerror = function () {
                requestAnimationFrame(function () { overlay.classList.add('show'); });
            };
            bigResult.src = src;
        }

        function closeCard() {
            overlay.classList.remove('show');
        }
    </script>

</body>
</html>
