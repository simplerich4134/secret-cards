<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- 給 LINE / FB 轉發用的預覽設定 (Open Graph) -->
    <meta property="og:title" content="秘密祝福卡">
    <meta property="og:description" content="宇宙每天給您的祝福，請憑直覺選擇一張卡！">
    <meta property="og:image" content="https://card-for-secret.netlify.app/back.jpg">
    <meta property="og:url" content="https://card-for-secret.netlify.app/">
    <meta property="og:type" content="website">

    <!-- 網頁瀏覽器分頁上的標題 -->
    <title>宇宙每天給您的祝福</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #A67B38;
            --gold-deep: #8F6A2E;
            --gold-line: #E6D09C;
            --serif: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
            --card-bright: 1.3; /* 翻開後卡片亮度（1 = 原圖） */
        }

        * { -webkit-tap-highlight-color: transparent; }

        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            /* 高度由下方程式依實際視窗設定（各家瀏覽器都準） */
            min-height: var(--vh, 100vh);
            font-family: var(--serif);
            margin: 0;
            padding: 12px 0 14px 0;
            box-sizing: border-box;

            /* 亮白、亮米色為主底，點綴優雅的金黃光暈流動（呼吸燈維持原樣） */
            background: linear-gradient(-45deg, #ffffff, #fdfbf4, #f5e3ad, #ffffff, #f9f4e3, #ebd494);
            background-size: 400% 400%;
            animation: gradientBreath 6s ease-in-out infinite;
        }

        @keyframes gradientBreath {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header { text-align: center; flex: 0 0 auto; padding: 0 12px; }

        h1 {
            color: var(--gold);
            font-size: 26px;
            font-size: min(6.6vw, 30px);
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: 0.15em;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(166, 123, 56, 0.18);
        }

        #statusText {
            color: var(--gold-deep);
            font-size: 15px;
            font-size: min(4vw, 17px);
            font-weight: 500;
            letter-spacing: 0.2em;
            white-space: nowrap;
            margin: 0;
        }

        /* 卡片寬度 --cw 由下方程式依視窗大小計算，確保四張卡＋文字＋按鈕一頁內看完 */
        .cards-grid {
            --cw: 150px;
            display: grid;
            grid-template-columns: repeat(2, var(--cw));
            column-gap: calc(var(--cw) * 0.14);
            row-gap: calc(var(--cw) * 0.07);
            justify-content: center;
            flex: 0 0 auto;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-slot {
            width: 100%;
            aspect-ratio: 2 / 3;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-slot:active { transform: scale(0.97); }

        .card-face {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.25);
            overflow: hidden;
        }
        .card-face img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 分類文字：在卡牌之下 */
        .card-title {
            color: var(--gold);
            /* 字級跟著卡片寬度縮放，永遠單行 */
            font-size: calc(var(--cw) * 0.105);
            font-weight: 700;
            letter-spacing: 0.18em;
            white-space: nowrap;
            margin-top: calc(var(--cw) * 0.05);
            padding-bottom: 3px;
            border-bottom: 2px solid var(--gold-line);
        }

        /* 下方唯一的膠囊 */
        .pill {
            flex: 0 0 auto;
            font-family: var(--serif);
            padding: 0.6em 2em;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.2em;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(253,247,229,0.92));
            color: var(--gold);
            border: 1px solid #D4AF37;
            border-radius: 999px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
            transition: 0.3s;
            white-space: nowrap;
        }
        .pill:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.15);
        }

        /* 「建構中」提示：畫面中央淡入，約兩秒後淡出 */
        #toast {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            padding: 16px 30px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.2em;
            white-space: nowrap;
            color: var(--gold);
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(253,247,229,0.96));
            border: 1px solid #D4AF37;
            border-radius: 999px;
            box-shadow: 0 8px 26px rgba(166, 123, 56, 0.28);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 20;
        }
        #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* ===== 抽牌後放大的大畫面 ===== */
        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: max(14px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom)) 0;
            box-sizing: border-box;
            background: rgba(253, 251, 244, 0.93);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
            overflow: hidden;
            z-index: 10;
        }
        /* open＝一按就先放大顯示卡背；show＝圖片載好後翻開 */
        #overlay.open, #overlay.show { opacity: 1; pointer-events: auto; }
        #overlay.open:not(.show) .big-inner { transform: scale(0.85) rotateY(0deg); }
        #overlay.open:not(.show) .big-front { animation: waitGlow 1.2s ease-in-out infinite; }
        @keyframes waitGlow {
            0%, 100% { box-shadow: 0 14px 40px rgba(166, 123, 56, 0.35); }
            50% { box-shadow: 0 14px 40px rgba(166, 123, 56, 0.35), 0 0 34px rgba(255, 210, 110, 0.9); }
        }
        #overlay.open:not(.show) .pill { visibility: hidden; }

        .big-slot {
            --bw: 300px; /* 由下方程式依視窗大小計算 */
            width: var(--bw);
            aspect-ratio: 2 / 3;
            perspective: 1400px;
        }
        .big-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: scale(0.7) rotateY(0deg);
            transition: transform 0.8s cubic-bezier(0.3, 0.2, 0.2, 1);
        }
        #overlay.show .big-inner { transform: scale(1) rotateY(180deg); }

        .big-front, .big-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 14px 40px rgba(166, 123, 56, 0.35);
        }
        .big-back { transform: rotateY(180deg); }
        /* 翻拍光線較暗，翻開後的卡片調亮、略增對比，讓字更清楚 */
        .big-back img { filter: brightness(var(--card-bright)) contrast(1.06) saturate(1.04); }
        .big-front img, .big-back img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ================= 美感效果（body 上的 fx1 到 fx6 控制開關） ================= */
        header, .cards-grid, body > .pill { position: relative; z-index: 1; }

        /* 效果 1：卡片輕微浮動，像在呼吸 */
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .fx1 .card-wrapper { animation: floatY 4.2s ease-in-out infinite; }
        .fx1 .card-wrapper:nth-child(2) { animation-delay: -1.1s; }
        .fx1 .card-wrapper:nth-child(3) { animation-delay: -2.3s; }
        .fx1 .card-wrapper:nth-child(4) { animation-delay: -3.2s; }

        /* 效果 2：金色光暈邊框，按下時變亮 */
        .fx2 .card-face {
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.25),
                        0 0 0 1px rgba(212, 175, 55, 0.45),
                        0 0 18px rgba(240, 210, 130, 0.55);
            transition: box-shadow 0.25s;
        }
        .fx2 .card-slot:active .card-face,
        .fx2 .card-slot:hover .card-face {
            box-shadow: 0 8px 22px rgba(212, 175, 55, 0.35),
                        0 0 0 1px rgba(212, 175, 55, 0.75),
                        0 0 28px rgba(245, 215, 130, 0.9);
        }

        /* 效果 3：翻牌時背後升起「太陽」——明亮日光核心＋粗細不一、邊緣柔和的光芒，
           兩層光芒以不同速度反向慢轉，看起來像陽光在閃耀；翻完後一道金光掃過卡面 */
        .big-slot { position: relative; }
        .big-inner { z-index: 1; }
        .sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 250%;
            aspect-ratio: 1;
            transform: translate(-50%, -50%) scale(0.3);
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }
        .sun > div {
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }
        /* 光芒：圖樣由下方程式隨機產生（每道光的角度、寬度、亮度都不同），往外漸漸淡出 */
        .sun .ray {
            -webkit-mask: radial-gradient(circle, #000 0%, #000 34%, rgba(0,0,0,0.7) 52%, rgba(0,0,0,0.3) 66%, transparent 78%);
            mask: radial-gradient(circle, #000 0%, #000 34%, rgba(0,0,0,0.7) 52%, rgba(0,0,0,0.3) 66%, transparent 78%);
            filter: blur(1.5px);
        }
        /* 光芒持續轉動不停止（兩層反向、不同速度） */
        .sun .r1 { animation: sunSpin 36s linear infinite; }
        .sun .r2 { animation: sunSpin 54s linear infinite reverse; opacity: 0.75; }
        /* 日光核心：中心近白、往外轉為金黃，輕輕呼吸 */
        .sun .core {
            background: radial-gradient(circle,
                rgba(255, 255, 248, 1) 0%,
                rgba(255, 248, 215, 0.98) 10%,
                rgba(255, 228, 140, 0.85) 20%,
                rgba(255, 205, 90, 0.5) 32%,
                rgba(255, 195, 70, 0.18) 44%,
                rgba(255, 195, 70, 0) 56%);
            animation: sunPulse 4s ease-in-out infinite;
        }
        @keyframes sunSpin { to { transform: rotate(360deg); } }
        @keyframes sunPulse {
            0%, 100% { transform: scale(1); opacity: 0.92; }
            50% { transform: scale(1.06); opacity: 1; }
        }
        @keyframes sunRise {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            40% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .fx3 #overlay.show .sun { animation: sunRise 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }

        /* 翻完後一道斜向金光掃過卡面 */
        .big-back::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, rgba(255, 255, 255, 0) 35%, rgba(255, 244, 205, 0.85) 50%, rgba(255, 255, 255, 0) 65%);
            transform: translateX(-120%);
            pointer-events: none;
        }
        @keyframes shineSweep {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(120%); }
        }
        .fx3 #overlay.show .big-back::after { animation: shineSweep 1.1s ease-in-out 0.85s forwards; }

        /* 效果 4：標題燙金質感，金光緩緩流過 */
        @keyframes goldShine {
            0% { background-position: 100% 50%; }
            100% { background-position: -100% 50%; }
        }
        .fx4 h1 {
            background: linear-gradient(100deg, #8F6A2E 0%, #B88A3E 30%, #F3DC9C 45%, #B88A3E 60%, #8F6A2E 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 1px 1px rgba(166, 123, 56, 0.25));
            animation: goldShine 5s linear infinite;
        }

        /* 效果 5：背景漂浮金粉 */
        #dust { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; display: none; }
        .fx5 #dust { display: block; }
        .dust {
            position: absolute;
            bottom: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 240, 190, 1) 0%, rgba(222, 184, 92, 0.8) 45%, rgba(222, 184, 92, 0) 70%);
            animation: dustUp linear infinite;
        }
        @keyframes dustUp {
            0% { transform: translate(0, 0); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.7; }
            100% { transform: translate(var(--dx), calc(var(--vh, 100vh) * -1 - 20px)); opacity: 0; }
        }

        /* 效果 6：抽到的卡上方顯示分類 */
        #bigLabel {
            display: none;
            color: var(--gold);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.3em;
            white-space: nowrap;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--gold-line);
        }
        .fx6 #bigLabel { display: block; }

        /* 測試用：效果開關面板（網址加 ?test 才會出現） */
        #fxPanel {
            position: fixed;
            right: 8px;
            top: 8px;
            z-index: 30;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #D4AF37;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            font-size: 13px;
            color: var(--gold-deep);
            font-family: "Microsoft JhengHei", sans-serif;
        }
        #fxPanel summary { padding: 6px 12px; cursor: pointer; font-weight: 700; }
        #fxPanel label { display: block; padding: 4px 12px; white-space: nowrap; }
        #fxPanel div { padding-bottom: 6px; }
    </style>
</head>
<body class="fx1 fx2 fx3 fx4 fx5 fx6">

    <!-- 背景漂浮金粉（效果 5） -->
    <div id="dust"></div>

    <header>
        <h1>宇宙每天給您的祝福</h1>
        <p id="statusText">請憑直覺選擇一張卡！</p>
    </header>

    <div class="cards-grid">
        <div class="card-wrapper" data-category="宇宙祝福">
            <div class="card-slot" onclick="drawCard(this)"><div class="card-face"><img src="back.jpg" alt="宇宙祝福"></div></div>
            <div class="card-title">宇宙祝福</div>
        </div>

        <div class="card-wrapper" data-category="每日實踐">
            <div class="card-slot" onclick="drawCard(this)"><div class="card-face"><img src="back.jpg" alt="每日實踐"></div></div>
            <div class="card-title">每日實踐</div>
        </div>

        <div class="card-wrapper" data-category="豐盛顯化">
            <div class="card-slot" onclick="drawCard(this)"><div class="card-face"><img src="back.jpg" alt="豐盛顯化"></div></div>
            <div class="card-title">豐盛顯化</div>
        </div>

        <div class="card-wrapper" data-category="心靈力量">
            <div class="card-slot" onclick="drawCard(this)"><div class="card-face"><img src="back.jpg" alt="心靈力量"></div></div>
            <div class="card-title">心靈力量</div>
        </div>
    </div>

    <button class="pill" onclick="showToast()">吸引力法則起源</button>

    <!-- 「建構中」提示 -->
    <div id="toast">建構中，敬請期待</div>

    <!-- 抽牌後的大畫面：上方卡片、下方「再翻一次」 -->
    <div id="overlay">
        <div id="bigLabel"></div>
        <div class="big-slot">
            <div class="sun">
                <div class="core"></div>
                <div class="ray r1"></div>
                <div class="ray r2"></div>
            </div>
            <div class="big-inner">
                <div class="big-front"><img src="back.jpg" alt="卡背"></div>
                <div class="big-back"><img id="bigResult" src="" alt="抽到的卡"></div>
            </div>
        </div>
        <button class="pill" onclick="closeCard()">再翻一次</button>
    </div>

    <script>
        // 定義不同的卡牌類別與 subset
        const dailyPracticeCardsSubset = [1, 2, 3, 4, 7, 13, 14, 16, 19, 20, 22, 24, 25, 30, 33, 35, 37, 41, 42, 43, 45, 49, 51, 53, 56, 57, 58, 59, 60, 61];
        const abundanceCardsSubset = [2, 4, 9, 10, 13, 16, 17, 23, 25, 32, 36, 38, 46, 48];
        const soulPowerCardsSubset = [5, 6, 8, 11, 12, 15, 16, 17, 18, 20, 21, 26, 27, 28, 29, 31, 34, 35, 39, 40, 41, 42, 44, 46, 47, 50, 52, 54, 55, 60, 61, 62];

        const allCategoryCards = {
            "宇宙祝福": Array.from({length: 62}, (_, i) => i + 1),
            "每日實踐": dailyPracticeCardsSubset,
            "豐盛顯化": abundanceCardsSubset,
            "心靈力量": soulPowerCardsSubset
        };

        const overlay = document.getElementById('overlay');
        const bigResult = document.getElementById('bigResult');

        // 依實際視窗大小計算卡片尺寸：用量到的標題、分類字、膠囊高度扣掉後，剩下的空間平分給兩排卡
        function fitLayout() {
            const W = document.documentElement.clientWidth;
            const H = window.innerHeight;
            const root = document.documentElement;
            root.style.setProperty('--vh', H + 'px');

            const grid = document.querySelector('.cards-grid');
            const headerH = document.querySelector('header').offsetHeight;
            const pillH = document.querySelector('body > .pill').offsetHeight;

            // 分類字高度約為卡寬的 0.105 × 1.5 行高 + 上方間距與底線，合計約卡寬的 0.23
            // 每欄高度 = 卡寬 × 1.5（卡片）+ 卡寬 × 0.23（分類字），兩排再加列距 0.07
            const spare = H - headerH - pillH - 26 /* 上下留白 */ - 36 /* 區塊間距 */;
            let cw = spare / (2 * 1.5 + 2 * 0.23 + 0.07);
            cw = Math.min(cw, W * 0.4, 230);
            cw = Math.max(cw, 80);
            grid.style.setProperty('--cw', Math.floor(cw) + 'px');

            // 大畫面：卡片儘量大，上方留給分類字、下方留給「再翻一次」
            const bigPillH = overlay.querySelector('.pill').offsetHeight;
            const labelH = document.getElementById('bigLabel').offsetHeight;
            const labelGap = labelH ? labelH + 22 : 0;
            let bw = Math.min(W * 0.86, 460, (H - bigPillH - labelGap - 22 - 40) * 2 / 3);
            overlay.querySelector('.big-slot').style.setProperty('--bw', Math.floor(Math.max(bw, 120)) + 'px');
        }
        fitLayout();
        window.addEventListener('resize', fitLayout);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLayout);

        // 每個分類事先抽好「下一張」並在背景下載（只下載 4 張，省流量），點下去就能立刻翻開
        const nextCard = {};
        function prepareNext(category) {
            const list = allCategoryCards[category];
            const src = "card(" + list[Math.floor(Math.random() * list.length)] + ").jpg";
            const img = new Image();
            img.src = src;
            nextCard[category] = img;
        }
        Object.keys(allCategoryCards).forEach(prepareNext);

        let drawing = false;
        function drawCard(slot) {
            if (drawing) return;   // 已經在抽，重複點擊一律忽略
            drawing = true;

            const category = slot.closest('.card-wrapper').getAttribute('data-category');
            const img = nextCard[category];
            prepareNext(category); // 立刻替這個分類準備下一張

            document.getElementById('bigLabel').textContent = category + "・今日指引";
            fitLayout();

            // 一按就先放大顯示卡背（有光暈閃動表示正在翻），圖片好了再翻開
            overlay.classList.add('open');
            function reveal() {
                bigResult.src = img.src;
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () { overlay.classList.add('show'); });
                });
            }
            if (img.complete) {
                reveal();
            } else {
                img.onload = img.onerror = reveal;
            }
        }

        let toastTimer = null;
        function showToast() {
            const t = document.getElementById('toast');
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2000);
        }

        function closeCard() {
            overlay.classList.remove('show', 'open');
            // 等淡出動畫結束才允許再抽，避免畫面跳動
            setTimeout(function () { drawing = false; }, 350);
        }

        // 效果 3：隨機產生自然的太陽光芒（每道光寬窄、亮度、間距都不同，邊緣柔和漸層）
        function sunRays(minGap, maxGap, minW, maxW, minA, maxA) {
            const clear = 'rgba(255, 215, 110, 0)';
            const stops = [clear + ' 0deg'];
            let a = Math.random() * maxGap;
            while (true) {
                const w = minW + Math.random() * (maxW - minW);
                if (a + w > 359) break;
                const alpha = (minA + Math.random() * (maxA - minA)).toFixed(2);
                const g = 205 + Math.floor(Math.random() * 40);   // 金黃到淡金
                const b = 90 + Math.floor(Math.random() * 90);
                stops.push(clear + ' ' + a.toFixed(1) + 'deg');
                stops.push('rgba(255, ' + g + ', ' + b + ', ' + alpha + ') ' + (a + w / 2).toFixed(1) + 'deg');
                stops.push(clear + ' ' + (a + w).toFixed(1) + 'deg');
                a += w + minGap + Math.random() * (maxGap - minGap);
            }
            stops.push(clear + ' 360deg');
            return 'conic-gradient(from ' + Math.floor(Math.random() * 360) + 'deg, ' + stops.join(', ') + ')';
        }
        document.querySelector('.sun .r1').style.background = sunRays(3, 14, 3, 9, 0.55, 0.95);
        document.querySelector('.sun .r2').style.background = sunRays(2, 10, 1.5, 4, 0.4, 0.8);

        // 效果 5：產生漂浮金粉（數量少、速度慢，不搶卡片風采）
        (function makeDust() {
            const box = document.getElementById('dust');
            for (let i = 0; i < 22; i++) {
                const d = document.createElement('span');
                const size = 3 + Math.random() * 5;
                d.className = 'dust';
                d.style.width = d.style.height = size + 'px';
                d.style.left = (Math.random() * 100) + '%';
                d.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
                d.style.animationDuration = (9 + Math.random() * 9) + 's';
                d.style.animationDelay = (-Math.random() * 18) + 's';
                box.appendChild(d);
            }
        })();

        // 測試用：網址加 ?test 會出現效果開關面板，可逐項關閉看差別
        if (location.search.indexOf('test') !== -1) {
            const names = ['1 卡片浮動', '2 金色光暈', '3 翻牌金光', '4 標題燙金', '5 漂浮金粉', '6 抽卡顯示分類'];
            const panel = document.createElement('details');
            panel.id = 'fxPanel';
            panel.open = false; // 預設收合，點「效果開關」才展開，避免擋住標題
            let html = '<summary>效果開關</summary><div>';
            names.forEach(function (n, i) {
                html += '<label><input type="checkbox" data-fx="fx' + (i + 1) + '" checked> ' + n + '</label>';
            });
            // 字體候選（皆為 Google Fonts 免費繁中字體），選到時才下載
            const fonts = [
                ['思源黑體（目前）', 'Noto Sans TC', 'Noto+Sans+TC:wght@500;700'],
                ['思源宋體（端正典雅）', 'Noto Serif TC', 'Noto+Serif+TC:wght@500;700'],
                ['霞鶩文楷（溫柔手寫楷書）', 'LXGW WenKai TC', 'LXGW+WenKai+TC:wght@400;700'],
                ['古典明朝（古籍刻本感）', 'Cactus Classical Serif', 'Cactus+Classical+Serif'],
                ['芫荽（清秀手寫）', 'Iansui', 'Iansui'],
                ['粉圓（圓潤可愛）', 'Huninn', 'Huninn']
            ];
            html += '</div><div style="padding:0 12px 8px">字體：<br><select id="fontPick" style="margin-top:4px;font-size:13px;max-width:190px">';
            fonts.forEach(function (f, i) { html += '<option value="' + i + '">' + f[0] + '</option>'; });
            html += '</select>';
            html += '<br><br>翻開卡片亮度：<b id="brightVal">130%</b><br><input id="brightPick" type="range" min="100" max="150" step="5" value="130" style="width:180px">';
            panel.innerHTML = html + '</div>';
            document.body.appendChild(panel);
            // 亮度滑桿：拖動時即時套用（面板浮在大畫面上方，可邊看卡片邊調）
            panel.addEventListener('input', function (e) {
                if (e.target.id !== 'brightPick') return;
                document.documentElement.style.setProperty('--card-bright', e.target.value / 100);
                document.getElementById('brightVal').textContent = e.target.value + '%';
            });
            panel.addEventListener('change', function (e) {
                if (e.target.id === 'brightPick') return;
                if (e.target.id === 'fontPick') {
                    const f = fonts[e.target.value];
                    if (!document.querySelector('link[data-font="' + f[1] + '"]')) {
                        const link = document.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = 'https://fonts.googleapis.com/css2?family=' + f[2] + '&display=swap';
                        link.setAttribute('data-font', f[1]);
                        document.head.appendChild(link);
                    }
                    document.documentElement.style.setProperty('--serif', '"' + f[1] + '", "Noto Sans TC", "Microsoft JhengHei", sans-serif');
                    if (document.fonts) document.fonts.load('700 20px "' + f[1] + '"', '宇宙祝福').then(fitLayout);
                    return;
                }
                document.body.classList.toggle(e.target.getAttribute('data-fx'), e.target.checked);
                fitLayout();
            });
        }
    </script>
